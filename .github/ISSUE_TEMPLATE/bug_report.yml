name: Public sample bug
description: Report a reproducible problem in the public repository samples.
title: "[Sample bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach paid PDF pages, order details, credentials, or employer-confidential material.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - DSA sample
        - SQL sample
        - Interview-answer sample
        - Architecture sample
        - Repository automation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Java, PostgreSQL, operating system, or tool versions when relevant.
